<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind App assignment - Offline page</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .offline-container {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 2rem;
            border-radius: 20px;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 1rem;
        }
        
        .emoji {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.3s ease;
        }
        
        button:hover {
            background: #5a6fd8;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="emoji">📶</div>
        <h1>You're Offline</h1>
        <p>Don't worry, the mind app still works offline.</p>
        <p>You can still:</p>
        <ul style="text-align: left; margin: 1rem 0;">
            <li>Log your moods</li>
            <li>View your history</li>
            <li>Delete entries</li>
            <li>Use basic weather data</li>
        </ul>
        <p>Weather updates will sync when you're back online.</p>
        
        <button onclick="window.location.href='./index.html'">Go to App</button>
    </div>
</body>
</html>
